name: Diagnose Guangdong Baer issue 252 timing

on:
  push:
    branches: [diagnose/252-guangdong-20260909]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -c constraints.txt -e ".[test]"
      - run: python -m playwright install chromium
      - name: Inspect render timing
        env:
          PYTHONUTF8: '1'
        run: python -B diagnose_guangdong_252.py
