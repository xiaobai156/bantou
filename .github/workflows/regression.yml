name: Offline regressions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    name: Windows / Python ${{ matrix.python }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11']

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}

      - name: Install pinned dependencies
        run: python -m pip install -c constraints.txt -e ".[test]"

      - name: Install Chromium for local smoke tests
        if: matrix.python == '3.11'
        run: python -m playwright install chromium

      - name: Compile sources
        run: python -B -m compileall -q bantou run_daily.py run_multi.py

      - name: Run regressions with Chromium smoke
        if: matrix.python == '3.11'
        run: python -B -m pytest -q tests
        env:
          RUN_BROWSER_SMOKE: '1'

      - name: Run regressions
        if: matrix.python != '3.11'
        run: python -B -m pytest -q tests

      - name: Check retry launcher
        run: python -B check_retry_input.py
