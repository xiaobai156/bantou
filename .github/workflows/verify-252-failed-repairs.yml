name: Verify issue 252 failed-site repairs

on:
  push:
    branches: [repair/252-failures-20260909]

permissions:
  contents: write

env:
  BASE_SHA: ca57138b0b676d5a0391ec70b7763ca545eba87b
  RESULT_BRANCH: repair/252-failures-result-20260909
  PYTHONUTF8: '1'

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out repair harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Preserve patch and targeted diagnostic
        shell: pwsh
        run: |
          Copy-Item .github/apply_252_failed_repairs.py.gz.b64 "$env:RUNNER_TEMP\repair.b64"
          Copy-Item diagnose_failed7_252.py "$env:RUNNER_TEMP\diagnose_failed7_252.py"

      - name: Check out untouched main baseline
        shell: pwsh
        run: |
          git fetch origin main
          $main = git rev-parse origin/main
          if ($main -ne $env:BASE_SHA) { throw "main changed during repair verification: $main" }
          git checkout -B issue252-tested-candidate $env:BASE_SHA

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Decode and apply production patch
        shell: pwsh
        run: |
          $encoded = Get-Content "$env:RUNNER_TEMP\repair.b64" -Raw
          $gz = "$env:RUNNER_TEMP\apply_252_failed_repairs.py.gz"
          [IO.File]::WriteAllBytes($gz, [Convert]::FromBase64String($encoded))
          python -c "import gzip,pathlib; pathlib.Path(r'$env:RUNNER_TEMP\apply_252_failed_repairs.py').write_bytes(gzip.decompress(pathlib.Path(r'$env:RUNNER_TEMP\apply_252_failed_repairs.py.gz').read_bytes()))"
          python -B "$env:RUNNER_TEMP\apply_252_failed_repairs.py"
          git diff --check
          git diff --exit-code -- sites.json recent_10_cache.json

      - name: Install pinned Python 3.11 dependencies
        run: python -m pip install -c constraints.txt -e ".[test]"

      - name: Install Chromium
        run: python -m playwright install chromium

      - name: Run Python 3.11 regressions with Chromium smoke
        shell: pwsh
        env:
          RUN_BROWSER_SMOKE: '1'
        run: |
          python -B -m compileall -q bantou run_daily.py run_multi.py
          python -B -m pytest -q tests
          python -B check_retry_input.py

      - name: Live recheck only the original seven failed sites
        shell: pwsh
        run: |
          python -B "$env:RUNNER_TEMP\diagnose_failed7_252.py" | Tee-Object "$env:RUNNER_TEMP\issue252-live.txt"
          python -c "from pathlib import Path; p=Path(r'$env:RUNNER_TEMP\issue252-live.txt'); t=p.read_text(encoding='utf-8-sig'); required=['揭竿而起','简单拖鞋','彩运通','萌小萌','广东八二','山高水厂']; lines=t.splitlines(); ok={line.split('\t')[1]:line for line in lines if line.startswith('SUCCESS\t')}; missing=[n for n in required if n not in ok]; assert not missing, 'still failing: '+','.join(missing); expected={'揭竿而起':'4头单','彩运通':'2头单','萌小萌':'3头双','广东八二':'1头双','山高水厂':'2头单'}; bad=[f'{n}:{ok[n].split(chr(9))[2]}' for n,v in expected.items() if ok[n].split('\t')[2]!=v]; assert not bad, 'unexpected values: '+','.join(bad); print('TARGETED_LIVE_GATE_OK')"

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'

      - name: Install pinned Python 3.10 dependencies
        run: python -m pip install -c constraints.txt -e ".[test]"

      - name: Run Python 3.10 regressions
        shell: pwsh
        run: |
          python -B -m pytest -q tests
          python -B check_retry_input.py

      - name: Publish clean tested candidate branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bantou/site_profiles/registry.py bantou/fetching/policy.py bantou/documents/dynamic/routes.py bantou/documents/dynamic/aggregate.py bantou/documents/collection.py tests/test_issue252_failed_repairs.py
          git diff --cached --check
          git diff --cached --quiet; if ($LASTEXITCODE -eq 0) { throw 'no production changes staged' }
          git commit -m "fix: repair issue 252 failed-site source handling"
          git push --force-with-lease origin HEAD:$env:RESULT_BRANCH
