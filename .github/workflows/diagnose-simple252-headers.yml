name: Diagnose simple 252 API headers

on:
  push:
    branches: [repair/252-failures-20260909]

permissions:
  contents: read

jobs:
  probe:
    if: github.event.head_commit.message == 'diag: run lightweight simple 252 header probe'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - env:
          PYTHONUTF8: '1'
        run: python -B diagnose_simple252_headers.py
