name: Audit round three repair and verification
on:
  push:
    branches: [repair/audit-round3-20260909]
permissions:
  contents: write
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 18
    env:
      PYTHONUTF8: '1'
      BASE_SHA: 709855cf32a42f26a3630038303c1a119e0c025b
      RESULT_BRANCH: repair/audit-round3-result-20260909
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Decode and apply reviewed repairs
        shell: pwsh
        run: |
          $encoded = [string]::Concat((Get-ChildItem .repair.part* | Sort-Object Name | ForEach-Object { Get-Content $_.FullName -Raw }))
          $bytes = [Convert]::FromBase64String($encoded)
          [IO.File]::WriteAllBytes('.repair_round3.py.gz', $bytes)
          python -c "import gzip,pathlib; pathlib.Path('.repair_round3.py').write_bytes(gzip.decompress(pathlib.Path('.repair_round3.py.gz').read_bytes()))"
          python -c "import base64;exec(base64.b64decode(''))"
          python -B .repair_round3.py
      - name: Install Python 3.11 dependencies
        run: python -m pip install -c constraints.txt -e ".[test]"
      - name: Install Chromium for isolated local smoke tests
        run: python -m playwright install chromium
      - name: Run Python 3.11 regressions and Chromium smoke
        shell: pwsh
        env:
          RUN_BROWSER_SMOKE: '1'
        run: |
          python -B -m compileall -q bantou run_daily.py run_multi.py
          python -B -m pytest -q tests
          python -B check_retry_input.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - name: Install Python 3.10 dependencies
        run: python -m pip install -c constraints.txt -e ".[test]"
      - name: Run Python 3.10 regressions
        shell: pwsh
        run: |
          python -B -m compileall -q bantou run_daily.py run_multi.py
          python -B -m pytest -q tests
          python -B check_retry_input.py
      - name: Publish tested candidate from the untouched main parent
        id: publish
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git read-tree $env:BASE_SHA
          $files = @(
            "bantou/parsers/segments.py",
            "bantou/parsers/matching.py",
            "bantou/text.py",
            "bantou/documents/content.py",
            "bantou/application/site_crawl.py",
            "bantou/outputs/formatting.py",
            "bantou/application/single_period.py",
            "bantou/application/multi_period.py",
            "bantou/fetching/browser_process.py",
            "bantou/documents/collection.py",
            "bantou/fetching/policy.py",
            "bantou/config/cli.py",
            "bantou/fetching/transport.py",
            "bantou/cache/validation.py",
            "bantou/application/site_validation.py",
            "constraints.txt",
            "tests/test_audit_repairs.py",
            "tests/test_audit_round3.py",
            "docs/audit-repair-round3-20260909.md"
          )
          git add -- $files
          git diff --cached --check
          git diff --cached --stat
          $tree = git write-tree
          $message = "fix: close remaining audited accuracy and isolation gaps`n`nWindows Python 3.10/3.11 regressions and local Chromium smoke passed.`nProduction sites, cache and result data were not changed."
          $commit = $message | git commit-tree $tree -p $env:BASE_SHA
          Write-Host "CANDIDATE_SHA=$commit"
          git push --force origin "${commit}:refs/heads/$env:RESULT_BRANCH"
          "candidate_sha=$commit" >> $env:GITHUB_OUTPUT
