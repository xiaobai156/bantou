name: Audit round three repair and verification
on:
  push:
    branches: [repair/audit-round3-20260909]
permissions:
  contents: write
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      BASE_SHA: 709855cf32a42f26a3630038303c1a119e0c025b
      RESULT_BRANCH: repair/audit-round3-result-20260909
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Apply reviewed repairs
        run: python -B .repair_apply_all.py
      - name: Install Python 3.11 dependencies
        run: python -m pip install -c constraints.txt -e ".[test]"
      - name: Install Chromium for isolated smoke tests
        run: python -m playwright install chromium
      - name: Compile Python 3.11 sources
        run: python -B -m compileall -q bantou run_daily.py run_multi.py
      - name: Run Python 3.11 regressions and Chromium smoke
        run: python -B -m pytest -q tests
        env:
          RUN_BROWSER_SMOKE: '1'
      - name: Check retry launcher on Python 3.11
        run: python -B check_retry_input.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - name: Install Python 3.10 dependencies
        run: python -m pip install -c constraints.txt -e ".[test]"
      - name: Compile Python 3.10 sources
        run: python -B -m compileall -q bantou run_daily.py run_multi.py
      - name: Run Python 3.10 regressions
        run: python -B -m pytest -q tests
      - name: Check retry launcher on Python 3.10
        run: python -B check_retry_input.py
      - name: Publish tested candidate from untouched main parent
        run: python -B .repair_publish.py
