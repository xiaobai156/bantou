name: Diagnose exact remaining issue 252 sources

on:
  push:
    branches: [repair/252-failures-20260909]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install pinned dependencies
        run: python -m pip install -c constraints.txt -e ".[test]"

      - name: Install Chromium
        run: python -m playwright install chromium

      - name: Inspect exact live sources
        env:
          PYTHONUTF8: '1'
        run: python -B diagnose_remaining_queries.py
