name: Publish verified issue 252 repairs

on:
  push:
    branches: [repair/252-failures-20260909]

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Check out staging branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Save verified patch
        shell: pwsh
        run: Copy-Item apply_252_repairs.py "$env:RUNNER_TEMP\apply_252_repairs.py"

      - name: Switch to fresh main
        shell: pwsh
        run: |
          git fetch origin main
          git checkout -B repair/252-result-20260909 origin/main

      - name: Apply verified patch
        shell: pwsh
        run: |
          $sitesBefore = (Get-FileHash sites.json -Algorithm SHA256).Hash
          $cacheBefore = (Get-FileHash recent_10_cache.json -Algorithm SHA256).Hash
          python -B "$env:RUNNER_TEMP\apply_252_repairs.py"
          if ((Get-FileHash sites.json -Algorithm SHA256).Hash -ne $sitesBefore) { throw 'sites.json changed' }
          if ((Get-FileHash recent_10_cache.json -Algorithm SHA256).Hash -ne $cacheBefore) { throw 'recent_10_cache.json changed' }

      - name: Verify production diff
        shell: pwsh
        run: |
          git diff --check
          $expected = @(
            'bantou/documents/collection.py',
            'bantou/fetching/policy.py',
            'bantou/site_profiles/registry.py'
          )
          $changed = @(git diff --name-only)
          if ($changed.Count -ne $expected.Count) { throw "unexpected diff count: $($changed -join ', ')" }
          foreach ($path in $expected) {
            if ($changed -notcontains $path) { throw "missing expected change: $path" }
          }

      - name: Commit result branch
        shell: pwsh
        run: |
          git config user.name 'xiaobai156'
          git config user.email '20069100+xiaobai156@users.noreply.github.com'
          git add bantou/documents/collection.py bantou/fetching/policy.py bantou/site_profiles/registry.py
          git commit -m 'fix: repair six verified issue 252 site failures'
          git push --force origin HEAD:refs/heads/repair/252-result-20260909
