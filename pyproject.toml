[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bantou-crawler"
version = "0.1.0"
description = "Strict source-bound half-head crawler"
requires-python = ">=3.10"
dependencies = ["requests>=2.32,<3", "playwright>=1.49,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["bantou*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
